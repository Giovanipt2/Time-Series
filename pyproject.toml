[project]
name = "time-series"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Giovani Mambrim Leme", email = "giovanimambrimleme.@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "pmdarima>=2.1.1",
    "statsmodels>=0.15.0",
    "yfinance>=1.8.0",
]

[project.scripts]
